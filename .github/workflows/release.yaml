name: "Release"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example 1.2.3"
        required: true
        type: string
      dry_run:
        description: "Run the release flow without publishing packages or committing version updates"
        required: false
        default: true
        type: boolean

  release:
    types:
      - published

jobs:
  deploy:
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' || github.event.inputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - name: Resolve release settings
        id: settings
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            raw_version="${RELEASE_TAG}"
            dry_run="false"
            mode="release"
          else
            raw_version="${INPUT_VERSION}"
            dry_run="${INPUT_DRY_RUN:-true}"

            if [[ "${dry_run}" == "true" ]]; then
              mode="dry-run"
            else
              mode="manual-release"
            fi
          fi

          version="${raw_version#v}"

          {
            echo "version=${version}"
            echo "dry_run=${dry_run}"
            echo "mode=${mode}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Set release version
        id: bump
        run: |
          bash .github/scripts/set-devcontainer-version.sh "${{ steps.settings.outputs.version }}"
          {
            echo 'manifest_files<<EOF'
            find features/src templates/src -type f \( -name 'devcontainer-feature.json' -o -name 'devcontainer-template.json' \) | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Template Docs
        run: |
          devcontainer templates generate-docs \
            --project-folder templates/src \
            --github-owner "${GITHUB_REPOSITORY_OWNER}" \
            --github-repo "${GITHUB_REPOSITORY#*/}"

      - name: Generate Feature Docs
        run: |
          devcontainer features generate-docs \
            --project-folder features/src \
            --namespace "${GITHUB_REPOSITORY}" \
            --github-owner "${GITHUB_REPOSITORY_OWNER}" \
            --github-repo "${GITHUB_REPOSITORY#*/}"

      - name: Verify release versions
        env:
          EXPECTED_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          set -euo pipefail
          expected_major="${EXPECTED_VERSION%%.*}"

          while IFS= read -r manifest_file; do
            manifest_version="$(jq -r '.version' "${manifest_file}")"
            if [[ "${manifest_version}" != "${EXPECTED_VERSION}" ]]; then
              echo "${manifest_file} has version ${manifest_version}; expected ${EXPECTED_VERSION}." >&2
              exit 1
            fi
          done < <(
            find features/src templates/src -type f \
              \( -name 'devcontainer-feature.json' -o -name 'devcontainer-template.json' \) \
              | sort
          )

          while IFS= read -r internal_reference; do
            if [[ ! "${internal_reference}" =~ ^ghcr\.io/althack/devcontainers/[^:]+:${expected_major}$ ]]; then
              echo "${internal_reference} does not use release major ${expected_major}." >&2
              exit 1
            fi
          done < <(
            find templates/src -type f -name '*.json' -print0 \
              | xargs -0 -r -n1 jq -r '.. | strings | select(test("^ghcr\\.io/althack/devcontainers/[^:]+:[^:]+$"))'
          )

      - name: Package release source bundle
        if: ${{ github.event_name == 'release' }}
        id: package
        run: |
          archive_path="$(bash .github/scripts/package-release-bundle.sh "${{ steps.settings.outputs.version }}")"
          {
            echo "archive_path=${archive_path}"
            echo "archive_name=$(basename "${archive_path}")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Feature publishing metadata
        if: ${{ steps.settings.outputs.dry_run == 'true' }}
        run: |
          devcontainer features package features/src \
            --output-folder "${RUNNER_TEMP}/features" \
            --force-clean-output-folder

      - name: Install ORAS
        if: ${{ steps.settings.outputs.dry_run != 'true' }}
        env:
          ORAS_VERSION: "1.3.3"
          ORAS_SHA256: "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59"
        run: |
          archive="${RUNNER_TEMP}/oras.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${ORAS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" oras
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Log in to GHCR
        if: ${{ steps.settings.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish Dev Container assets
        if: ${{ steps.settings.outputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-devcontainer-assets.sh ghcr.io "${GITHUB_REPOSITORY}"

      - name: Upload release source bundle
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.archive_path }}" --clobber

      - name: Summarize release run
        run: |
          {
            echo "### Release workflow"
            echo ""
            echo "- Mode: ${{ steps.settings.outputs.mode }}"
            echo "- Version: ${{ steps.settings.outputs.version }}"
            echo "- Publish packages: ${{ steps.settings.outputs.dry_run != 'true' }}"
            echo "- Attach source bundle to release: ${{ github.event_name == 'release' }}"
            echo ""
            echo "Updated manifest files:"
            echo '```text'
            printf '%s\n' "${{ steps.bump.outputs.manifest_files }}"
            echo '```'
            if [[ "${{ github.event_name }}" == "release" ]]; then
              echo ""
              echo "Release asset:"
              echo '```text'
              printf '%s\n' "${{ steps.package.outputs.archive_name }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
