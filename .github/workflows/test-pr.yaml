name: "CI - Test Templates And Features"
on:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Smoke test for "gz"
        id: smoke_test
        uses: ./.github/actions/smoke-test
        with:
          template: "gz"

  x11-feature-tests:
    runs-on: ubuntu-latest
    env:
      DISPLAY: ":99"
      XDG_RUNTIME_DIR: /tmp/devcontainers-x11-runtime
      XAUTHORITY: /tmp/devcontainers-xauthority.test
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Prepare X11 test environment
        run: bash features/test/linux-x11-forwarding/prepare-host.sh

      - name: Test X11 Feature default
        run: |
          devcontainer features test \
            --features linux-x11-forwarding \
            --project-folder features \
            --skip-scenarios \
            --skip-duplicated

      - name: Test X11 Feature scenarios
        run: |
          for scenario in \
            host_forwarding_env \
            software_gl_disabled \
            software_gl_enabled
          do
            devcontainer features test \
              --features linux-x11-forwarding \
              --project-folder features \
              --skip-autogenerated \
              --skip-duplicated \
              --filter "${scenario}"
          done

      - name: Test X11 Feature without host Xauthority
        run: |
          mkdir -p "${XDG_RUNTIME_DIR}"
          touch "${XDG_RUNTIME_DIR}/.mutter-Xwaylandauth.test"

          env -u XAUTHORITY devcontainer features test \
            --features linux-x11-forwarding \
            --project-folder features \
            --skip-autogenerated \
            --skip-duplicated \
            --filter xwayland_authority_fallback

  pulseaudio-feature-tests:
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp/devcontainers-pulseaudio-runtime
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Prepare PulseAudio test environment
        run: bash features/test/linux-pulseaudio-forwarding/prepare-host.sh

      - name: Prepare X11 composition fixtures
        run: bash features/test/linux-pulseaudio-forwarding/prepare-x11-host.sh

      - name: Test PulseAudio Feature
        run: |
          devcontainer features test \
            --features linux-pulseaudio-forwarding \
            --project-folder features

  ros2-default-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Validate ROS 2 configuration
        run: python3 features/test/ros2/validate_config.py

      - name: Test ROS 2 default
        run: |
          devcontainer features test \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu-24.04 \
            --features ros2 \
            --project-folder features \
            --skip-duplicated \
            --skip-scenarios

  ros2-scenario-tests:
    name: "ROS 2 ${{ matrix.scenario }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - humble
          - kilted
          - ros_core
          - lyrical
          - osrf_ros
          - upstream_ros
          - workspace_overlay
          - shells
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Test ROS 2 ${{ matrix.scenario }}
        run: |
          devcontainer features test \
            --features ros2 \
            --project-folder features \
            --skip-autogenerated \
            --skip-duplicated \
            --filter "${{ matrix.scenario }}"

  ros2-conflict-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reject conflicting existing ROS distribution
        run: docker build --file features/test/ros2-conflict/Dockerfile .

  ros2-idempotency-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ROS 2 Feature twice
        run: docker build --file features/test/ros2-idempotency/Dockerfile .

  feature-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Package Features
        run: |
          devcontainer features package features/src \
            --output-folder "${RUNNER_TEMP}/features" \
            --force-clean-output-folder

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Generate Template Docs
        run: |
          devcontainer templates generate-docs \
            --project-folder templates/src \
            --github-owner "${GITHUB_REPOSITORY_OWNER}" \
            --github-repo "${GITHUB_REPOSITORY#*/}"

      - name: Generate Feature Docs
        run: |
          devcontainer features generate-docs \
            --project-folder features/src \
            --namespace "${GITHUB_REPOSITORY}" \
            --github-owner "${GITHUB_REPOSITORY_OWNER}" \
            --github-repo "${GITHUB_REPOSITORY#*/}"

      - name: Verify generated docs are up to date
        run: git diff --exit-code -- features/src templates/src

  release-version-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test release version stamping
        run: bash .github/scripts/test-set-devcontainer-version.sh

  complete:
    needs:
      - docs-check
      - feature-package
      - x11-feature-tests
      - pulseaudio-feature-tests
      - ros2-default-test
      - ros2-conflict-test
      - ros2-idempotency-test
      - ros2-scenario-tests
      - smoke-test
      - release-version-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
          X11_FEATURE_TESTS_RESULT: ${{ needs.x11-feature-tests.result }}
          PULSEAUDIO_FEATURE_TESTS_RESULT: ${{ needs.pulseaudio-feature-tests.result }}
          ROS2_DEFAULT_TEST_RESULT: ${{ needs.ros2-default-test.result }}
          ROS2_CONFLICT_TEST_RESULT: ${{ needs.ros2-conflict-test.result }}
          ROS2_IDEMPOTENCY_TEST_RESULT: ${{ needs.ros2-idempotency-test.result }}
          ROS2_SCENARIO_TESTS_RESULT: ${{ needs.ros2-scenario-tests.result }}
          FEATURE_PACKAGE_RESULT: ${{ needs.feature-package.result }}
          DOCS_CHECK_RESULT: ${{ needs.docs-check.result }}
          RELEASE_VERSION_TEST_RESULT: ${{ needs.release-version-test.result }}
        run: |
          set -euo pipefail

          check_result() {
            local job_name="$1"
            local result="$2"
            echo "${job_name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              echo "Required job '${job_name}' did not succeed."
              exit 1
            fi
          }

          check_result "smoke-test" "${SMOKE_TEST_RESULT}"
          check_result "x11-feature-tests" "${X11_FEATURE_TESTS_RESULT}"
          check_result "pulseaudio-feature-tests" "${PULSEAUDIO_FEATURE_TESTS_RESULT}"
          check_result "ros2-default-test" "${ROS2_DEFAULT_TEST_RESULT}"
          check_result "ros2-conflict-test" "${ROS2_CONFLICT_TEST_RESULT}"
          check_result "ros2-idempotency-test" "${ROS2_IDEMPOTENCY_TEST_RESULT}"
          check_result "ros2-scenario-tests" "${ROS2_SCENARIO_TESTS_RESULT}"
          check_result "feature-package" "${FEATURE_PACKAGE_RESULT}"
          check_result "docs-check" "${DOCS_CHECK_RESULT}"
          check_result "release-version-test" "${RELEASE_VERSION_TEST_RESULT}"

          echo "All required jobs completed successfully."
